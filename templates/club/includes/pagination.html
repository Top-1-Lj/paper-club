{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="分页">
  <span class="pagination-info">共 {{ page_obj.paginator.count }} 项 · 第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页</span>
  <div class="pagination-actions">
    {% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}" class="button button-small button-outline">← 上一页</a>{% else %}<span class="button button-small button-outline disabled" aria-disabled="true">← 上一页</span>{% endif %}
    {% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}" class="button button-small button-outline">下一页 →</a>{% else %}<span class="button button-small button-outline disabled" aria-disabled="true">下一页 →</span>{% endif %}
  </div>
</nav>
{% endif %}
